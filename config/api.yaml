# Personal AI OS — Provider 默认配置模板
# API Key 不在仓库中保存；运行时通过本地设置或环境变量提供。
api:
  current_provider: "openai"
  base_url: ""
  timeout: 60
  max_retries: 3
  retry_delay: 1.0
  streaming: true
  max_tokens_default: 4096
  temperature_default: 0.7

  providers:
    openai:
      enabled: true
      base_url: "https://api.openai.com/v1"
      api_key: ""
      models: []

    claude:
      enabled: false
      base_url: "https://api.anthropic.com/v1"
      api_key: ""
      models: []

    gemini:
      enabled: false
      base_url: "https://generativelanguage.googleapis.com/v1"
      api_key: ""
      models: []

    deepseek:
      enabled: false
      base_url: "https://api.deepseek.com/v1"
      api_key: ""
      models: []

    qwen:
      enabled: false
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      models: []

    ollama:
      enabled: false
      base_url: "http://localhost:11434/v1"
      api_key: ""
      models: []

    lm_studio:
      enabled: false
      base_url: "http://localhost:1234/v1"
      api_key: ""
      models: []

    openrouter:
      enabled: false
      base_url: "https://openrouter.ai/api/v1"
      api_key: ""
      models: []

    siliconflow:
      enabled: false
      base_url: "https://api.siliconflow.cn/v1"
      api_key: ""
      models: []

    custom:
      enabled: false
      base_url: ""
      api_key: ""
      models: []
